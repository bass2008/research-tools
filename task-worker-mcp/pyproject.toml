[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskworker"
version = "0.1.0"
description = "Транспорт LLM-задач конвейера ниш: stdio MCP-сервер + блокирующее ожидание джобов"
requires-python = ">=3.12"
# Только транспорт: ни Anthropic SDK, ни Redis тут не нужны (tech-design §7).
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
taskworker = "taskworker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
