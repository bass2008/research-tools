appId: com.arcanasense.app
---
- launchApp:
    clearState: true
- assertVisible:
    id: tab-today
- openLink: 'arcanasense://login'
- tapOn:
    id: auth-email
- inputText: '${EMAIL}'
- tapOn:
    id: auth-password
- inputText: '${PASSWORD}'
- hideKeyboard
- tapOn:
    id: auth-submit
- extendedWaitUntil:
    visible:
      id: account-profile
    timeout: 30000
