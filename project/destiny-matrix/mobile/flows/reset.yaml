appId: com.arcanasense.app
---
- openLink: '${RESET_URL}'
- extendedWaitUntil:
    visible: 'Reset password'
    timeout: 30000
- tapOn:
    id: auth-password
- inputText: 'Mobile-reset-8675'
- hideKeyboard
- tapOn:
    id: auth-submit
- extendedWaitUntil:
    visible:
      id: account-profile
    timeout: 30000
- takeScreenshot: reset-from-email
