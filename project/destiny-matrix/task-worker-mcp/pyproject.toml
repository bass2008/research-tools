[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcanatasks"
version = "0.1.0"
description = "Исполнитель очереди задач Arcana Sense: stdio MCP-сервер + блокирующее ожидание задач"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
arcana-tasks = "arcanatasks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
