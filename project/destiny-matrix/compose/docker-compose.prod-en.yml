# Английский боевой контур: та же машина, домен arcana-sense.com.
#
# Отличия от русского прода, и каждое — по причине:
#   • SITE_LANG=en: корпус, словари и подписи метода вшиты в образ web, api отдаёт письма и
#     ошибки на том же языке;
#   • ALL_FREE_WITHOUT_PAYMENT=1: кассы за пределами России нет (docs/foreign-acquiring.md),
#     поэтому разбор открыт всем, `/pay` отвечает 404, тарифы не показываются;
#   • PAYMENT_PROVIDER=mock: платить негде и нечем, запросы до банка не доходят;
#   • свой том prod-en-api-var: аккаунты английского сайта не смешиваются с русскими;
#   • печать берётся у общего браузера машины — он один на все контуры.
#
# Поднимается отдельным проектом: docker compose -p arcana-prod-en -f docker-compose.prod-en.yml up -d
name: arcana-prod-en

services:
  # Имена сервисов уникальны на всю машину: compose добавляет алиас по имени сервиса в каждую
  # сеть, и одноимённый «web» в общей сети печати уже приводил к тому, что браузер печатал
  # чужую страницу.
  en-api:
    image: ${REGISTRY:-arcana}/api:${TAG:-prod-en}
    # Секреты — только файлом: явное значение в environment имеет приоритет над env_file и
    # затёрло бы ключ пустой строкой.
    env_file:
      - path: .env.prod-en
        required: false
    environment:
      APP_ENV: prod
      SITE_LANG: en
      ALL_FREE_WITHOUT_PAYMENT: 1
      SITE_URL: https://arcana-sense.com
      PAYMENT_PROVIDER: mock
      MOCK_PAYMENTS: 1
      ADMIN_EMAILS: ${ADMIN_EMAILS:-snborodaenko@mail.ru}
      MATRICES_HARD_CAP: 2000
      PRINT_WARMUP: 0
      PRINT_SLOTS: 1
      BROWSER_URL: http://browser:3001
      WEB_INTERNAL_URL: http://en-web:3000
      MONITORING_FOLDER: ""
      BUILD_COMMIT: ${TAG:-prod-en}
    volumes:
      - prod-en-api-var:/srv/api/var
      # Логи nginx только на чтение: краулеры ходят по страницам и до api не доходят, увидеть
      # их можно единственным способом — прочитать лог.
      - ${NGINX_LOG_DIR:-/var/log/nginx}:/var/log/nginx:ro
    networks:
      - default
      - print
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  en-web:
    image: ${REGISTRY:-arcana}/web:${TAG:-prod-en}
    environment:
      API_INTERNAL_URL: http://en-api:8010
      # язык и витрина вшиты в образ на сборке; здесь они нужны приёмке и логам
      NEXT_PUBLIC_SITE_LANG: en
      NEXT_PUBLIC_ALL_FREE_WITHOUT_PAYMENT: 1
      SESSION_COOKIE_SECURE: 1
    ports:
      # свой порт: 3000 занят русским продом, 3100 — русским тестом, 3300 — английским тестом
      - "127.0.0.1:${PROD_EN_WEB_PORT:-3400}:3000"
    volumes:
      - ${PROD_EN_STATIC_DIR:-/srv/arcana/static-prod-en}:/static-out
    command: sh -c "rm -rf /static-out/* && cp -a /app/.next/static/. /static-out/ && exec node server.js"
    networks:
      - default
      - print
    depends_on:
      en-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  prod-en-api-var:

networks:
  print:
    external: true
    name: arcana-print
