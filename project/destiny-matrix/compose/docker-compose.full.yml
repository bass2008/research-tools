# Оба сайта на одной машине: русский на 3000, английский на 3001. Отдельный файл, а не второй
# запуск `run.sh`, потому что язык вшивается в образ на сборке — нужны два разных образа web и
# два api рядом. Базы разные, браузер печати один на обоих: он держит до 350 МБ.
#
#   scripts/run-full.sh
#
# Боевая раскладка живёт в других файлах (`docker-compose.yml`, `docker-compose.prod-en.yml`):
# здесь сборка из исходников и игрушечные деньги.
name: arcana-full

services:
  ru-api:
    build:
      context: ..
      dockerfile: compose/api.Dockerfile
    env_file:
      - path: ${HOME}/.config/arcana/reports.env
        required: false
      - path: ${HOME}/.config/arcana/smtp.env
        required: false
    environment:
      APP_ENV: dev
      SITE_LANG: ru
      ALL_FREE_WITHOUT_PAYMENT: 0
      MOCK_PAYMENTS: 1
      PAYMENT_PROVIDER: mock
      MAIL_TO_LOG: 1
      # печать складывает готовый PDF на диск контейнера: без хранилища api отвечает 503
      # и задание даже не заводится — на стенде это выглядит как «печать висит».
      REPORTS_STORE: local
      JWT_SECRET: ${JWT_SECRET_RU:-dev-secret-ru-dev-secret-ru-000}
      BROWSER_URL: http://browser:3001
      BROWSER_SECRET: ${BROWSER_SECRET:-dev-browser-secret-full}
      WEB_INTERNAL_URL: http://ru-web:3000
      SITE_URL: http://127.0.0.1:3000
      ADMIN_EMAILS: ${ADMIN_EMAILS:-snborodaenko@mail.ru}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-123}
      BUILD_COMMIT: ${BUILD_COMMIT:-full}
    volumes:
      - ru-api-var:/srv/api/var
      # разбивка ресурсов по контурам в админке: имена контейнеров и счётчики cgroup
      - /sys/fs/cgroup:/host/cgroup:ro
      - /var/lib/docker/containers:/host/containers:ro
    cgroup: host
    ports:
      - "127.0.0.1:8010:8010"
    networks:
      - default
      - print
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 10s

  ru-web:
    build:
      context: ../web
      dockerfile: ../compose/web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        NEXT_PUBLIC_SITE_LANG: ru
        NEXT_PUBLIC_ALL_FREE_WITHOUT_PAYMENT: 0
        BUILD_COMMIT: ${BUILD_COMMIT:-full}
    environment:
      API_INTERNAL_URL: http://ru-api:8010
      NEXT_PUBLIC_SITE_LANG: ru
      SESSION_COOKIE_SECURE: 0
      SESSION_COOKIE_NAME: destiny_session_ru
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      ru-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 10s

  en-api:
    build:
      context: ..
      dockerfile: compose/api.Dockerfile
    env_file:
      - path: ${HOME}/.config/arcana/reports.env
        required: false
      - path: ${HOME}/.config/arcana/smtp.env
        required: false
    environment:
      APP_ENV: dev
      SITE_LANG: en
      # кассы за пределами России нет: разбор открыт целиком (docs/foreign-acquiring.md)
      ALL_FREE_WITHOUT_PAYMENT: 1
      MOCK_PAYMENTS: 1
      PAYMENT_PROVIDER: mock
      MAIL_TO_LOG: 1
      # печать складывает готовый PDF на диск контейнера: без хранилища api отвечает 503
      # и задание даже не заводится — на стенде это выглядит как «печать висит».
      REPORTS_STORE: local
      JWT_SECRET: ${JWT_SECRET_EN:-dev-secret-en-dev-secret-en-000}
      BROWSER_URL: http://browser:3001
      BROWSER_SECRET: ${BROWSER_SECRET:-dev-browser-secret-full}
      WEB_INTERNAL_URL: http://en-web:3000
      SITE_URL: http://127.0.0.1:3001
      ADMIN_EMAILS: ${ADMIN_EMAILS:-snborodaenko@mail.ru}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-123}
      BUILD_COMMIT: ${BUILD_COMMIT:-full}
    volumes:
      - en-api-var:/srv/api/var
      - /sys/fs/cgroup:/host/cgroup:ro
      - /var/lib/docker/containers:/host/containers:ro
    cgroup: host
    ports:
      - "127.0.0.1:8210:8010"
    networks:
      - default
      - print
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 10s

  en-web:
    build:
      context: ../web
      dockerfile: ../compose/web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3001
        NEXT_PUBLIC_SITE_LANG: en
        NEXT_PUBLIC_ALL_FREE_WITHOUT_PAYMENT: 1
        BUILD_COMMIT: ${BUILD_COMMIT:-full}
    environment:
      API_INTERNAL_URL: http://en-api:8010
      NEXT_PUBLIC_SITE_LANG: en
      NEXT_PUBLIC_ALL_FREE_WITHOUT_PAYMENT: 1
      SESSION_COOKIE_SECURE: 0
      SESSION_COOKIE_NAME: destiny_session_en
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      en-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 10s

  browser:
    build:
      context: .
      dockerfile: browser.Dockerfile
    environment:
      BROWSER_SECRET: ${BROWSER_SECRET:-dev-browser-secret-full}
      MAX_JOBS: 50
      MAX_RSS_MB: 400
    mem_limit: 512m
    networks:
      - default
      - print
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  ru-api-var:
  en-api-var:

networks:
  print:
    external: true
    name: arcana-print
