x-site-profiles: &site-profiles >-
  [{"origin":"http://localhost:${WEB_PORT:-3000}","hosts":["localhost:${WEB_PORT:-3000}","ru.localhost:${WEB_PORT:-3000}"],"defaultLocale":"ru","locales":["ru"],"payments":[{"id":"${PAYMENT_PROVIDER:-mock}","provider":"${PAYMENT_PROVIDER:-mock}","notificationUrl":"http://localhost:${WEB_PORT:-3000}/api/payments/notify/${PAYMENT_PROVIDER:-mock}"}]},{"origin":"http://127.0.0.1:${WEB_PORT:-3000}","hosts":["127.0.0.1:${WEB_PORT:-3000}","com.localhost:${WEB_PORT:-3000}","web:3000","prod-web:3000"],"defaultLocale":"en","locales":["en","ru"],"payments":[]}]

# Локальная надстройка: compose подхватывает её сам, без флагов. На боевую машину едет только
# база, поэтому сборка из исходников и dev-секреты туда не попадают.
services:
  api:
    build:
      context: ..
      dockerfile: compose/api.Dockerfile
    # Ключи Postbox и бакета отчётов лежат вне репозитория. Без env_file они попадали в контейнер
    # только если их экспортировали в оболочке — и терялись при следующем пересоздании.
    env_file:
      - path: ${HOME}/.config/arcana/reports.env
        required: false
      - path: ${HOME}/.config/arcana/smtp.env
        required: false
      - path: ${HOME}/.config/arcana/tbank.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-dev}
      # локальная разработка платит игрушечными деньгами
      MOCK_PAYMENTS: ${MOCK_PAYMENTS:-1}
      SITE_PROFILES: *site-profiles
      # локально платим моком и читаем письма из логов; живой банк — PAYMENT_PROVIDER=tbank
      # отчёты остаются в контейнере: раньше прогоны e2e складывали PDF в боевой бакет
      REPORTS_STORE: ${REPORTS_STORE:-local}
      MAIL_TO_LOG: ${MAIL_TO_LOG:-1}
      # прогрев печати после оплаты; PRINT_WARMUP=0 — проверять печать по нажатию
      PRINT_WARMUP: ${PRINT_WARMUP:-1}
      # только локально: в test/prod базовый интервал остаётся равен одному часу
      PRESENCE_FLUSH_SECONDS: ${PRESENCE_FLUSH_SECONDS:-3600}
    ports:
      # api наружу — только для отладки: браузер ходит во фронт
      - "127.0.0.1:${API_PORT:-8010}:8010"

  browser:
    build:
      context: .
      dockerfile: browser.Dockerfile
    # тот же секрет, что у api: иначе печать получает 403
    env_file:
      - path: ${HOME}/.config/arcana/reports.env
        required: false

  web:
    build:
      context: ../web
      dockerfile: ../compose/web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://127.0.0.1:3000}
        # Резервный язык; язык запроса выбирается профилем домена ниже.
        NEXT_PUBLIC_SITE_LANG: ${SITE_LANG:-ru}
        NEXT_PUBLIC_ALL_FREE_WITHOUT_PAYMENT: ${ALL_FREE_WITHOUT_PAYMENT:-0}
        # локально счётчик выключен: включить — METRIKA_ID=111856670 scripts/run.sh
        NEXT_PUBLIC_METRIKA_ID: ${METRIKA_ID:-}
        # версия сборки: отдаётся на /version/current.txt и видна в админке
        BUILD_COMMIT: ${BUILD_COMMIT:-—}
        BUILD_BRANCH: ${BUILD_BRANCH:-—}
        BUILD_TIME: ${BUILD_TIME:-—}
        BUILD_ISO: ${BUILD_ISO:-}
    environment:
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://127.0.0.1:3000}
      SITE_PROFILES: *site-profiles
      # по http кука с secure не ставится и вход не работает
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://web:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    ports: !override
      - "${WEB_PORT:-3000}:3000"
    # статику локально раздаёт сам node: nginx впереди нет, каталог хоста не нужен
    volumes: !override []
    command: !override node server.js
