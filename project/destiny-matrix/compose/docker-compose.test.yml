x-site-profiles: &site-profiles >-
  [{"origin":"https://test.arcana-sense.ru","hosts":["test.arcana-sense.ru"],"defaultLocale":"ru","locales":["ru"],"payments":[{"id":"tbank","provider":"tbank","notificationUrl":"https://test.arcana-sense.ru/api/payments/notify/tbank"}]},{"origin":"https://test.arcana-sense.com","hosts":["test.arcana-sense.com","test-web:3000","web:3000","127.0.0.1:3000"],"defaultLocale":"en","locales":["en","ru"],"payments":[]}]

# Общий тестовый контур: test.arcana-sense.ru и test.arcana-sense.com.
#
# Отличия от прода, и каждое — по причине:
#   • свои образы с тегом test-*: фичи проверяются агентами до того, как уедут на прод;
#   • своя база (том test-api-var): прогоны не засоряют данные покупателей;
#   • тестовый терминал банка: агенты платят игрушечными картами, а не деньгами;
#   • печать берётся у прода — браузерный контейнер один на машину, он держит до 350 МБ,
#     и второй такой в 2 ГБ памяти не влезает. Общий предел печатей живёт внутри browser;
#   • прогрев печати выключен: тестовых оплат десятки, и каждая занимала бы общий браузер;
#   • письма только в лог: агенты не должны рассылать почту нашим доменом;
#   • счётчик Метрики не собирается вовсе — статистика прода остаётся чистой.
#
# Поднимается отдельным проектом: docker compose -p arcana-test -f docker-compose.test.yml up -d
name: arcana-test

services:
  # Сервисы нейтральны к языку. В общей сети печати используются уникальные алиасы test-*,
  # чтобы общий browser не спутал API и страницы основного и тестового сайтов.
  api:
    image: ${REGISTRY:-arcana}/api:${TAG:-test}
    env_file:
      - path: .env.test
        required: false
    environment:
      APP_ENV: prod
      # Язык API по умолчанию и единый режим доступа заданы явно для обоих доменов.
      SITE_LANG: ru
      ALL_FREE_WITHOUT_PAYMENT: 0
      SITE_PROFILES: *site-profiles
      # как и на локальном стенде: прогоны не должны попадать в боевое хранилище
      REPORTS_STORE: local
      MAIL_TO_LOG: 1
      PRINT_WARMUP: 0
      PRINT_SLOTS: 1
      MOCK_PAYMENTS: 1
      ADMIN_EMAILS: ${ADMIN_EMAILS:-snborodaenko@mail.ru}
      MATRICES_HARD_CAP: 2000
      BROWSER_URL: http://browser:3001
      # адрес именно тестового web: имя «web» браузер печати резолвил бы в своей сети — то есть
      # в прод-web, и печатал бы чужую страницу (получался файл на 50 КБ вместо трёх мегабайт)
      WEB_INTERNAL_URL: http://test-web:3000
      # метрики с теста в облако не отправляем: прогоны агентов смешались бы с боевыми числами
      MONITORING_FOLDER: ""
      BUILD_COMMIT: ${TAG:-test}
    volumes:
      - test-api-var:/srv/api/var
    networks:
      default: {}
      print:
        aliases:
          - test-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    image: ${REGISTRY:-arcana}/web:${TAG:-test}
    environment:
      API_INTERNAL_URL: http://test-api:8010
      SITE_PROFILES: *site-profiles
      NEXT_PUBLIC_SITE_LANG: ru
      NEXT_PUBLIC_ALL_FREE_WITHOUT_PAYMENT: 0
      SESSION_COOKIE_SECURE: 1
    ports:
      # наружу смотрит nginx хоста; порт другой, чтобы не спорить с продом
      - "127.0.0.1:${TEST_WEB_PORT:-3100}:3000"
      - "127.0.0.1:${TEST_EN_WEB_PORT:-3300}:3000"
    volumes:
      - ${TEST_STATIC_DIR:-/srv/arcana/static-test}:/static-out
      - ${TEST_EN_STATIC_DIR:-/srv/arcana/static-test-en}:/static-en-out
    command: sh -c "rm -rf /static-out/* && cp -a /app/.next/static/. /static-out/ && rm -rf /static-en-out/* && cp -a /app/.next/static/. /static-en-out/ && exec node server.js"
    networks:
      default: {}
      print:
        aliases:
          - test-web
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  test-api-var:

networks:
  # сеть только для печати: в ней у тестового api виден единственный чужой сервис — browser.
  # Подключать тест к сети прода целиком нельзя: там есть свои api и web, и имена бы столкнулись.
  print:
    external: true
    name: arcana-print
