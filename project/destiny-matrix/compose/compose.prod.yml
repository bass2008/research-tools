# Раскладка боевой машины, воспроизведённая локально: nginx — единственная точка входа,
# `_next/static` он отдаёт с диска, а node и FastAPI наружу не смотрят вовсе.
#
#   docker compose -f docker-compose.yml -f compose.prod.yml up -d --build
#   (то же самое делает ./run.sh --prod)
#
# Отличия от боевой машины ровно два: TLS там терминирует сам nginx по сертификату certbot,
# и `_next/static` дополнительно уезжает в Object Storage (infra/terraform/site) — за этим
# сюда ставится NEXT_ASSET_PREFIX.
services:
  api:
    ports: !override []          # к FastAPI ходит только BFF, снаружи его нет

  web:
    ports: !override []          # наружу смотрит nginx, а не node
    environment:
      # За TLS-терминатором кука обязана быть secure: иначе она уедет и по http тоже
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
    build:
      args:
        # адрес, с которого браузер берёт чанки: пусто — их отдаёт nginx с диска
        NEXT_ASSET_PREFIX: ${ASSET_PREFIX:-}
    volumes:
      - web-static:/static-out
    # статика уходит в том, откуда её раздаёт nginx; дальше обычный запуск standalone-сервера
    command: sh -c "rm -rf /static-out/* && cp -a /app/.next/static/. /static-out/ && exec node server.js"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - web-static:/srv/web/static:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  web-static:
