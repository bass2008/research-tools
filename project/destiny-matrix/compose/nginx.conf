# Единая точка входа — как на боевой машине (infra/terraform/server/cloud-init.yaml.tftpl).
# И страницы, и /api/ уходят на node: BFF внутри Next сам ходит в FastAPI и сам ставит
# httpOnly-куку. Прямого пути от браузера к FastAPI нет — иначе токен приходит телом ответа,
# и его читает JavaScript.
server_tokens off;
client_max_body_size 2m;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

upstream web_app {
    server web:3000;
}

server {
    listen 80;
    server_name _;

    # Чанки с хешем в имени отдаёт nginx с диска, node на них не тратит цикл событий.
    # Том наполняет контейнер web при старте: раскладка та же, что на машине.
    location /_next/static/ {
        alias /srv/web/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://web_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # по нему Next понимает, что снаружи https, даже когда внутрь идёт http
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }
}
