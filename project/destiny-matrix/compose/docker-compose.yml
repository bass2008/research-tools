# Весь продукт двумя контейнерами: FastAPI и node-сервер Next.js. Раскладка та же, что на
# машине (docs/api-contract.md, «Раскладка деплоя»): браузер ходит только во фронт, а фронт
# своим BFF — в api по внутренней сети. Порт api наружу открыт только для отладки.
name: arcana

services:
  api:
    build:
      context: ..
      dockerfile: compose/api.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-dev}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-меняется-в-проде-обязательно}
      MOCK_PAYMENTS: ${MOCK_PAYMENTS:-1}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-snborodaenko@mail.ru}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-123}
      MATRICES_HARD_CAP: ${MATRICES_HARD_CAP:-2000}
    volumes:
      # база переживает пересборку образа: платежи и матрицы не одноразовые
      - api-var:/srv/api/var
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: ../web
      dockerfile: ../compose/web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://127.0.0.1:3000}
        # версия сборки: отдаётся на /version/current.txt и видна в админке
        BUILD_COMMIT: ${BUILD_COMMIT:-—}
        BUILD_BRANCH: ${BUILD_BRANCH:-—}
        BUILD_TIME: ${BUILD_TIME:-—}
    environment:
      # BFF ходит в api по имени сервиса — наружу этот адрес не попадает
      API_INTERNAL_URL: http://api:8010
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://127.0.0.1:3000}
      # по http кука с secure не ставится и вход не работает; на домене с TLS поставить 1
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  api-var:
