# Английский тестовый контур: та же машина, свой домен test.arcana-sense.com.
#
# Отличия от русского теста, и каждое — по причине:
#   • SITE_LANG=en: корпус, словари и подписи метода вшиты в образ web, а api отдаёт свои
#     письма и ошибки на том же языке;
#   • ALL_FREE_WITHOUT_PAYMENT=1: кассы за пределами России пока нет (docs/foreign-acquiring.md),
#     поэтому разбор открыт всем, включая незарегистрированных;
#   • свой том test-en-api-var: аккаунты английских прогонов не смешиваются с русскими;
#   • платежей нет вовсе: PAYMENT_PROVIDER=mock, до банка запросы не доходят;
#   • печать берётся у прода — браузерный контейнер один на машину.
#
# Поднимается отдельным проектом: docker compose -p arcana-test-en -f docker-compose.test-en.yml up -d
name: arcana-test-en

services:
  # Имена сервисов уникальны на всю машину: compose добавляет алиас по имени сервиса в каждую
  # сеть, куда подключает контейнер, и одноимённый «web» в общей сети печати уже приводил к тому,
  # что браузер прода печатал чужую страницу.
  test-en-api:
    image: ${REGISTRY:-arcana}/api:${TAG:-test-en}
    env_file:
      - path: .env.test-en
        required: false
    environment:
      APP_ENV: prod
      SITE_LANG: en
      ALL_FREE_WITHOUT_PAYMENT: 1
      SITE_URL: https://test.arcana-sense.com
      # касса английского контура не подключена: оплата отвечает 409, платить нечем и незачем
      PAYMENT_PROVIDER: mock
      MOCK_PAYMENTS: 1
      REPORTS_STORE: local
      MAIL_TO_LOG: 1
      PRINT_WARMUP: 0
      PRINT_SLOTS: 1
      ADMIN_EMAILS: ${ADMIN_EMAILS:-snborodaenko@mail.ru}
      MATRICES_HARD_CAP: 2000
      BROWSER_URL: http://browser:3001
      WEB_INTERNAL_URL: http://test-en-web:3000
      MONITORING_FOLDER: ""
      BUILD_COMMIT: ${TAG:-test-en}
    volumes:
      - test-en-api-var:/srv/api/var
    networks:
      - default
      - print
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  test-en-web:
    image: ${REGISTRY:-arcana}/web:${TAG:-test-en}
    environment:
      API_INTERNAL_URL: http://test-en-api:8010
      # язык и витрина вшиты в образ на сборке; здесь они нужны приёмке и логам
      NEXT_PUBLIC_SITE_LANG: en
      NEXT_PUBLIC_ALL_FREE_WITHOUT_PAYMENT: 1
      SESSION_COOKIE_SECURE: 1
    ports:
      # свой порт: 3000 занят продом, 3100 — русским тестом
      - "127.0.0.1:${TEST_EN_WEB_PORT:-3300}:3000"
    volumes:
      - ${TEST_EN_STATIC_DIR:-/srv/arcana/static-test-en}:/static-out
    command: sh -c "rm -rf /static-out/* && cp -a /app/.next/static/. /static-out/ && exec node server.js"
    networks:
      - default
      - print
    depends_on:
      test-en-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  test-en-api-var:

networks:
  print:
    external: true
    name: arcana-print
