[pytest]
testpaths = .
python_files = test_*.py
addopts = -p no:cacheprovider -m "not bank"
markers =
    bank: идёт на живой тестовый терминал банка, запускается отдельно (-m bank)
    bug: регрессия на дефект, найденный живым прогоном по сайту
    open_bug: дефект найден, но ещё не исправлен — тест красный намеренно (-m open_bug)
