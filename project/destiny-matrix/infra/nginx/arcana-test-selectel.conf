# Тестовый контур: та же машина, свой поддомен и свой порт. Прод не задевает.
#
# Закрыт паролем целиком, кроме двух адресов. Причина: robots.txt только просит не обходить, и
# GPTBot этой просьбы не читал — за время, пока контур был открыт, он выкачал 16 662 страницы.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name test.arcana-sense.ru;

    # Отдельного сертификата у теста здесь нет: имя входит в SAN общего arcana-sense.ru.
    ssl_certificate /etc/letsencrypt/live/arcana-sense.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcana-sense.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    access_log /var/log/nginx/access.log arcana;
    include /etc/nginx/snippets/arcana-filters.inc;

    # noindex остаётся на случай, если пароль когда-нибудь снимут: заголовок запрещает показ
    # в выдаче, а не обход.
    add_header X-Robots-Tag "noindex, nofollow" always;

    auth_basic           "arcana-test";
    auth_basic_user_file /etc/nginx/.htpasswd-test;

    location /_next/static/ {
        alias /srv/arcana/static-test/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Банк должен доставлять уведомления о тестовых платежах: с паролем они отбивались бы 401,
    # и оплата подтверждалась бы только досверкой.
    location /api/payments/notify {
        auth_basic off;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Снаружи должно быть видно, что контур жив, — иначе проверка доступности требует пароля.
    location /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/reports {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
