# Раскладка на машине Selectel: четыре контура на одном адресе, различаются по server_name —
# русский сайт, его тест, английский сайт и его тест.
# Сертификат один на все домены: arcana-sense.ru, www, test и arcana-sense.com.
# www отдавал те же страницы своим адресом — для поиска это второй сайт с тем же текстом.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.arcana-sense.ru;

    ssl_certificate /etc/letsencrypt/live/arcana-sense.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcana-sense.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://arcana-sense.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.arcana-sense.com;

    ssl_certificate /etc/letsencrypt/live/arcana-sense.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcana-sense.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://arcana-sense.com$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name arcana-sense.ru _;

    ssl_certificate /etc/letsencrypt/live/arcana-sense.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcana-sense.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    access_log /var/log/nginx/access.log arcana;
    include /etc/nginx/snippets/arcana-filters.inc;

    # Чанки с хешем в имени отдаёт nginx с диска: контейнер выкладывает их туда при старте.
    location /_next/static/ {
        alias /srv/arcana/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Печать синхронная и занимает до полуминуты: общего таймаута в 30 секунд ей мало.
    location /api/reports {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
    }
}

# Английский сайт. До запуска здесь стоял лендинг со статикой из /srv/landing — файлы на
# машине остались, вернуть его можно одной правкой этого блока.
#
# Пароля нет и `noindex` нет: домен для того и заводился, чтобы его индексировали. Что закрыто
# от обхода, решает сам сайт в `robots.ts` — на боевом адресе своего языка он печатает запреты
# по разделам, а на любом другом контуре закрывает всё целиком.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name arcana-sense.com;

    ssl_certificate /etc/letsencrypt/live/arcana-sense.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcana-sense.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    access_log /var/log/nginx/access.log arcana;
    include /etc/nginx/snippets/arcana-filters.inc;

    # Чанки с хешем в имени отдаёт nginx с диска: контейнер выкладывает их туда при старте.
    location /_next/static/ {
        alias /srv/arcana/static-prod-en/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Печать синхронная и занимает до полуминуты: общего таймаута в 30 секунд ей мало.
    location /api/reports {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
    }

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Проверка владения доменом при продлении сертификата идёт по http и должна доходить
    # до файла, а не упираться в редирект.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
