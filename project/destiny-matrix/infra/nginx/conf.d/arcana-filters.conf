# Быстрый отсев мусора: сканеры не должны доходить до Node.
#
# Смысл именно в этом: 404 сам по себе дёшев, но отдаёт его не nginx, а Next.js — каждый запрос
# сканера будил Node и рендерил страницу «не найдено» (замеряно: 19,7 мс процессора на запрос).
# За сутки таких запросов около шестисот, а при всплеске сканирования они складываются в реальную
# нагрузку на машине с гарантированными 10% ядра, где рядом печатается PDF.
#
# Ограничение частоты и fail2ban сознательно не используются: порог, который ловит сканер, ловит
# и человека при первой загрузке страницы, а бан по числу 404 отрезал бы наши же прогоны — они
# специально ходят на /no-such-page.

# Имя домена и время ответа в логе: без них нельзя разделить контуры и найти медленные запросы.
log_format arcana '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" $request_time';

# Точные имена сканеров, которые уже приходили. Не эвристика «похоже на бота»: HeadlessChrome и
# curl здесь отсутствуют намеренно — под ними работают наши собственные прогоны и проверки.
map $http_user_agent $arcana_scanner {
    default                                                                     0;
    "~*libredtail|l9explore|zgrab|masscan|ExchangeScanner|Expanse|Censys"       1;
    "~*InternetMeasurement|NetSystemsResearch|CensysInspect|Odin"               1;
}

# Свои адреса: с них ходят проверки контуров, и пустой User-Agent у них поводом для отказа не станет.
geo $arcana_trusted {
    default        0;
    40.69.0.186/32 1;
    127.0.0.1/32   1;
}

# Пустой User-Agent бывает у сканеров и у попыток прогнать через нас чужой трафик; у браузеров он
# есть всегда. Комбинация «не наш адрес и пусто» — единственный случай отказа.
map "$arcana_trusted:$http_user_agent" $arcana_no_agent {
    default 0;
    "0:"    1;
}
