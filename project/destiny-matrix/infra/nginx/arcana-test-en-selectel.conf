# Международный домен общего тестового приложения. Отдельный порт — вход в тот же web.
#
# Закрыт паролем целиком, кроме health: robots.txt только просит не обходить, и GPTBot этой
# просьбы не читал — за время, пока русский тест был открыт, он выкачал 16 662 страницы.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name test.arcana-sense.com;

    # Имя входит в SAN сертификата arcana-sense.com рядом с лендингом (bootstrap-machine.sh).
    ssl_certificate /etc/letsencrypt/live/arcana-sense.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcana-sense.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    access_log /var/log/nginx/access.log arcana;
    include /etc/nginx/snippets/arcana-filters.inc;

    # noindex остаётся на случай, если пароль когда-нибудь снимут: заголовок запрещает показ
    # в выдаче, а не обход.
    add_header X-Robots-Tag "noindex, nofollow" always;

    auth_basic           "arcana-test-en";
    auth_basic_user_file /etc/nginx/.htpasswd-test;

    location /_next/static/ {
        alias /srv/arcana/static-test-en/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Снаружи должно быть видно, что контур жив, — иначе проверка доступности требует пароля.
    # Исключения Basic Auth для Т-Банка здесь нет: подключение разрешено только на .ru.
    # NotificationURL тестового подключения: https://test.arcana-sense.ru/api/payments/notify/tbank.
    location /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/reports {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
