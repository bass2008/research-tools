# Единая точка входа. И страницы, и /api/ уходят на node в контейнере: BFF внутри Next сам
# ходит в FastAPI по внутренней сети docker и сам ставит httpOnly-куку. Прямого пути от
# браузера к FastAPI нет — иначе токен приходит телом ответа, и его читает JavaScript.
server {
    server_name arcana-sense.ru www.arcana-sense.ru _;

    access_log /var/log/nginx/access.log arcana;
    include /etc/nginx/snippets/arcana-filters.inc;

    # Чанки с хешем в имени отдаёт nginx с диска: контейнер выкладывает их в этот каталог
    # при старте, node на них не тратит цикл событий.
    location /_next/static/ {
        alias /srv/arcana/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Печать PDF идёт синхронно и на слабой машине занимает под полминуты: с общим таймаутом 30 с
    # ответ не доходил до браузера, хотя файл уже был готов.
    location /api/reports {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/arcana-sense.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/arcana-sense.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.arcana-sense.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = arcana-sense.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name arcana-sense.ru www.arcana-sense.ru _;
    return 404; # managed by Certbot




}