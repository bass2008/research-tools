<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Матрица пары — 4 · Расклад</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="v4.css">
</head>
<body class="v4">
  <main class="felt">
    <header class="v4-head">
      <p class="kicker">Расклад пары по матрице судьбы</p>
      <h1 id="title"></h1>
      <p class="dates" id="dates"></p>
    </header>
    <section class="lay lay-main" id="main"></section>
    <p class="hint">Нажмите на карту, чтобы перевернуть</p>
    <section class="lay lay-rest" id="rest"></section>
    <section class="medal">
      <div class="medal-oct" id="medal"></div>
      <p>Матрица пары</p>
    </section>
    <details class="persons">
      <summary>Личные матрицы</summary>
      <div class="persons-grid" id="persons"></div>
    </details>
  </main>
  <script src="pair.js"></script>
  <script src="shared.js"></script>
  <script src="v4.js"></script>
</body>
</html>
