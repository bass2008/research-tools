<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Матрица пары — 3 · Навигатор</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="v3.css">
</head>
<body class="v3">
  <div class="app">
    <aside class="map">
      <div class="map-oct" id="map-oct"></div>
      <div class="now" id="now"></div>
    </aside>
    <section class="pane">
      <header class="pane-head">
        <p class="kicker">Матрица пары</p>
        <h1 id="title"></h1>
        <p class="dates" id="dates"></p>
        <nav class="tabs" role="tablist">
          <button type="button" class="tab-btn on" data-tab="read">Разбор</button>
          <button type="button" class="tab-btn" data-tab="people">Личные матрицы</button>
          <button type="button" class="tab-btn" data-tab="all">Все точки</button>
        </nav>
      </header>
      <div class="tab" data-tab="read" id="read"></div>
      <div class="tab" data-tab="people" id="people" hidden></div>
      <div class="tab" data-tab="all" id="all" hidden></div>
    </section>
  </div>
  <script src="pair.js"></script>
  <script src="shared.js"></script>
  <script src="v3.js"></script>
</body>
</html>
