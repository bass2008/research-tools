[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    llm: платные проверки настоящих промптов и качества суждений (testing-plan §6)
    live: сквозной прогон на живых данных — XMLRiver и LLM за деньги (testing-plan §9)
# по умолчанию платные слои выключены (testing-plan §11)
addopts = -m "not llm and not live" -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*
